[package]
name = "corvane-git"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Corvane git engine: gitoxide reads, git CLI writes"

[dependencies]
corvane-models.workspace = true
gix.workspace = true
libc = "0.2"
thiserror.workspace = true
tracing.workspace = true

# Android has no Trash; discarded files are deleted there
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"

[dev-dependencies]
tempfile = "3"
