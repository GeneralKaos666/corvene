[package]
name = "corvene-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Corvene OS integration: paths, keychain, trash, editors, shells"

[dependencies]
dirs.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
ureq.workspace = true

# freedesktop.org Trash spec (the crate corvene-git already uses); Android
# has no Trash
[target.'cfg(not(any(target_os = "macos", target_os = "android")))'.dependencies]
trash = "5"

# Windows: toasts through notify-rust's WinRT backend, everything else
# through the Win32 API
[target.'cfg(windows)'.dependencies]
notify-rust = "4"
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
libc = "0.2"
# org.freedesktop.Notifications (the crate GPUI's Linux backend uses)
notify-rust = "4"
# the XDG desktop portal's appearance settings (high contrast)
zbus = "5"
# Hunspell dictionaries for the commit form's spellcheck (what Chromium
# checks with on Linux)
spellbook = "0.4"

# Android Keystore: `keyring`'s own API has no store there, its Android
# store plugs into keyring-core
[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

[dev-dependencies]
tempfile = "3"

