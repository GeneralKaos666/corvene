[package]
name = "corvane"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GitHub Desktop clone"
default-run = "corvane"

[[bin]]
name = "corvane"
path = "src/main.rs"

# Android: the NativeActivity loads `libcorvane.so`, which has `main.rs` as a
# module (`android.rs`). Empty on every other platform.
[lib]
name = "corvane"
path = "src/android.rs"
crate-type = ["cdylib"]
test = false
doctest = false
doc = false

[features]
# Compile Metal shaders at runtime so a full Xcode install is not required for
# development builds. Release CI passes --no-default-features to precompile.
default = ["runtime-shaders"]
runtime-shaders = ["gpui-pre-apple/runtime_shaders"]
# Offscreen window snapshots for visual checks without screen-recording rights:
# `CORVANE_SNAPSHOT=<png> [CORVANE_SNAPSHOT_DELAY_MS=4000]` renders the window
# after the delay, saves it and quits; `CORVANE_CONTROL=<port>` serves the parity
# harness (tools/parity). Development only (pulls GPUI's test support).
# The "full" build: every on-demand pack compiled in.
full = ["corvane-highlight/bundled-syntax-extended", "corvane-highlight/bundled-tree-sitter"]
snapshots = [
    "dep:gpui-pre",
    "dep:gpui-pre-macos",
    "dep:image",
    "dep:serde_json",
    "gpui-pre/test-support",
    "gpui-pre-macos/test-support",
    "dep:gpui-pre-linux",
    "gpui-pre-linux/test-support",
]

[dependencies]
libc = "0.2"
gpui-kit.workspace = true
gpui-pre = { version = "=0.3.7", optional = true }
serde_json = { workspace = true, optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
corvane-core.workspace = true
corvane-github.workspace = true
corvane-highlight.workspace = true
corvane-platform.workspace = true
corvane-store.workspace = true
corvane-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rust-embed.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-apple = { workspace = true, optional = true }
gpui-pre-macos = { version = "=0.3.7", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# `snapshots`: offscreen frames (`render_to_image`) on Linux
gpui-pre-linux = { version = "=0.3.7", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# the Android platform layer for the pinned GPUI (gpui-mobile's src/android)
gpui-pre-android = { path = "../../vendor/gpui-pre-android" }
# calls into packaging/android's CorvaneActivity
jni = "0.22"
# the assets are compiled in even in debug builds: the device has no
# checkout to read them from
rust-embed = { workspace = true, features = ["debug-embed"] }
