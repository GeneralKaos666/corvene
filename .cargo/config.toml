# MSVC reads C sources in the system code page unless told they are UTF-8;
# grammar parsers name nodes like "⇒" in string literals. cl.exe reads extra
# options from `CL`, which clang ignores: ring builds with clang on Windows
# ARM and rejects `/utf-8` in CFLAGS.
[env]
CL = "/utf-8"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# the 32-bit Linux builds are cross-compiled (packaging/linux/package.sh)
[target.i686-unknown-linux-gnu]
linker = "i686-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
