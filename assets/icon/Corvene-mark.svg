<svg xmlns="http://www.w3.org/2000/svg" viewBox="232 214 596 596" width="16" height="16">
<!-- The app icon's glyph alone, in one colour: the mark in the Windows title
     bar, where GitHub Desktop shows its own (the octicon `mark-github`). -->
<defs>
  <mask id="nodes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#fff"/>
    <circle cx="651" cy="334" r="34" fill="#000"/>
    <circle cx="651" cy="690" r="34" fill="#000"/>
    <circle cx="528" cy="502" r="34" fill="#000"/>
  </mask>
</defs>
<g transform="translate(18 0)" mask="url(#nodes)">
  <g fill="none" stroke="#000" stroke-width="96" stroke-linecap="round">
    <path d="M 651 334 A 226 226 0 1 0 651 690"/>
    <path d="M 528 502 C 528 612, 578 652, 651 690"/>
  </g>
  <circle cx="651" cy="334" r="84"/>
  <circle cx="651" cy="690" r="84"/>
  <circle cx="528" cy="502" r="84"/>
</g>
</svg>
