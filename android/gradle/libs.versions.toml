# Corvene for Android: every version in one place. build-logic reads this file
# too (build-logic/settings.gradle.kts), so the convention plugins and the
# modules can never disagree. Each pin says why it is not the newest release.
# Checked against Google Maven / Maven Central on 2026-10-03.

[versions]
# AGP 9.4 needs Gradle 9.6; the wrapper is 9.5.0, the same as WMKeyboard's.
agp = "9.3.0"
# AGP 9's built-in Kotlin (no kotlin-android plugin). 2.2.20 is what Coil
# 3.2, detekt 1.23 and Konsist 0.17 read; Kotlin 2.4 metadata would lock them out.
kotlin = "2.2.20"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
# Compose UI 1.11 / Material3 1.4.0. 2026.08.00 and up carry compose-ui 1.12,
# whose aar metadata demands compileSdk 37.
composeBom = "2026.06.01"
# 1.3.0 needs compileSdk 37; 1.2.0 asks for 35.
composeAdaptive = "1.2.0"
# 1.2.0 (2026-09-23) needs compileSdk 37.
navigation3 = "1.1.0"
# runtime-compose (collectAsStateWithLifecycle) and process only: no ViewModel.
lifecycle = "2.9.0"
coroutines = "1.10.2"
serializationJson = "1.8.1"
# UniFFI's Kotlin bindings call the library through JNA (direct mapping).
# 5.16+ ship a libjnidispatch.so aligned for 16 KB pages; 5.19.1 is the latest.
jna = "5.19.1"
# Avatars from files the engine downloaded: coil-core + compose-core only (no
# OkHttp, no network fetcher). 3.5 needs Kotlin 2.4 metadata.
coil = "3.2.0"
splashscreen = "1.0.1"
# The hourly background fetch (CoroutineWorker); the design's pin.
work = "2.10.0"
# Custom Tabs for the sign-in pages; the design's pin.
browser = "1.9.0"
profileinstaller = "1.4.1"
# JankStats (JankMonitor); the design's pin.
metricsPerformance = "1.0.0"
# The baseline profile plugin and the macrobenchmarks share benchmark's
# version; 1.5.0 is the first that knows AGP 9.
benchmark = "1.5.0"
uiautomator = "2.4.0"
# Kotlin-only preferences until the Rust settings carry them (the design style).
datastore = "1.1.7"
androidxTracing = "1.3.0"
junit = "4.13.2"
# 4.16.1 has no android-all for 36.1: robolectric.properties pins sdk=35.
robolectric = "4.16.1"
roborazzi = "1.75.0"
androidxTestJunit = "1.2.1"
espressoCore = "3.6.1"
turbine = "1.2.1"
# The latest; bundles its own Kotlin 2.0 parser, which reads 2.2 sources.
konsist = "0.17.3"
# detekt 2.x is alpha; 1.23.8 is the last stable line.
detekt = "1.23.8"
composeLints = "1.5.3"
# 0.9.5 is the first release that understands AGP 9.
kover = "0.9.9"
licensee = "1.14.1"
# 3.19.x pulls a Kotlin 2.4 BOM onto the build classpath; build-logic pins the
# Kotlin daemon client back (see build-logic/build.gradle.kts).
dependencyAnalysis = "3.19.2"
foojay = "1.0.0"
# Asserted by GenerateUniffiTask against crates/corvene-ffi/Cargo.toml.
uniffi = "0.32"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-text = { module = "androidx.compose.ui:ui-text" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }
androidx-compose-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "composeAdaptive" }
androidx-compose-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "composeAdaptive" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-metrics-performance = { module = "androidx.metrics:metrics-performance", version.ref = "metricsPerformance" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "androidxTracing" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
# Always with `artifact { type = "aar" }`: the aar carries libjnidispatch.so per ABI.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
# Rule packs, through the detektPlugins / lintChecks configurations.
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
compose-lint-checks = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "composeLints" }

# The Gradle plugins as build-logic dependencies (plugin marker coordinates).
gradle-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-kotlin-compose = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradle-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
gradle-kotlin-daemon-client = { module = "org.jetbrains.kotlin:kotlin-daemon-client", version.ref = "kotlin" }
gradle-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradle-roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
gradle-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
gradle-licensee = { module = "app.cash.licensee:licensee-gradle-plugin", version.ref = "licensee" }
gradle-baselineprofile = { module = "androidx.baselineprofile:androidx.baselineprofile.gradle.plugin", version.ref = "benchmark" }
gradle-dependency-analysis = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependencyAnalysis" }

[plugins]
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
