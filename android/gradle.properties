# Gradle settings for Corvene's Android app.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.daemon.idletimeout=1800000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Connected tests leave the app installed: uninstalling deletes the store.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# The application's versionCode; versionName comes from ../Cargo.toml.
corvene.versionCode=1
# Dependency Analysis reads fossDebug only.
dependency.analysis.android.ignored.variants=fossRelease,playDebug,playRelease,fossFast,playFast

# Switches (also in local.properties or the environment, see README.md):
# corvene.abis=arm64-v8a                 ABIs of the native libraries
# corvene.rustProfile=dev                cargo profile (dev, release, profiling)
# corvene.rustFeatures=                  cargo features of corvene-ffi
# corvene.prebuiltRustDir=               skip cargo: <dir>/<abi>/libcorvene_ffi.so
# corvene.bundledGitDir=                 where lib{git,ssh,...}.so live per ABI
# corvene.idSuffix=.compose              applicationIdSuffix of debug builds
# corvene.splitApks=false                one APK per ABI
# corvene.play=false                     the Play bundle with :grammars (M-A6)
# corvene.benchmark=false                :benchmark (M-A5)
# warningsAsErrors=false                 Kotlin warnings fail the build
