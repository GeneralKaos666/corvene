    restrictToConfig: true
    returnValueAnnotations:
      - '*.CheckResult'
      - '*.CheckReturnValue'
  ImplicitDefaultLocale:
    active: true
  ImplicitUnitReturnType:
    active: false
  InvalidRange: { active: true }
  IteratorHasNextCallsNextMethod: { active: true }
  IteratorNotThrowingNoSuchElementException: { active: true }
  LateinitUsage:
    active: false
  MapGetWithNotNullAssertionOperator: { active: true }
  MissingPackageDeclaration: { active: true }
  NullCheckOnMutableProperty:
    active: false
  NullableToStringCall: { active: true }
  PropertyUsedBeforeDeclaration:
    active: false
  UnconditionalJumpStatementInLoop: { active: true }
  UnnecessaryNotNullCheck: { active: true }
  UnnecessaryNotNullOperator: { active: true }
  UnnecessarySafeCall: { active: true }
  UnreachableCatchBlock: { active: true }
  UnreachableCode: { active: true }
  UnsafeCallOnNullableType: { active: true }
  UnsafeCast: { active: true }
  UnusedUnaryOperator: { active: true }
  WrongEqualsTypeParameter: { active: true }
style:
  active: true
  AlsoCouldBeApply: { active: false }
  BracesOnIfStatements:
    active: false
  BracesOnWhenStatements:
    active: false
  CanBeNonNullable: { active: false }
  CascadingCallWrapping: { active: false }
  ClassOrdering: { active: false }
  CollapsibleIfStatements: { active: false }
  DataClassContainsFunctions: { active: false }
  DataClassShouldBeImmutable: { active: true }
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 4
  DoubleNegativeLambda: { active: true }
  EqualsNullCall: { active: true }
  EqualsOnSignatureLine: { active: false }
  ExplicitCollectionElementAccessMethod: { active: true }
  ExplicitItLambdaParameter: { active: true }
  ExpressionBodySyntax: { active: false }
  ForbiddenAnnotation:
    active: true
    annotations:
      - reason: 'it is a Java annotation; use `@Suppress` instead'
        value: 'java.lang.SuppressWarnings'
      - reason: 'it is a Java annotation; use `@Deprecated` instead'
        value: 'java.lang.Deprecated'
      - reason: 'it is a Java annotation; use `@Throws` instead'
        value: 'java.lang.annotation.Documented'
  ForbiddenComment:
    active: true
    severity: 'info'
    comments:
      - reason: 'Forbidden FIXME — fix it or file it.'
        value: 'FIXME:'
      - reason: 'Debug leftover.'
        value: 'STOPSHIP'
  ForbiddenImport:
    active: true
    imports:
      - reason: 'Use kotlinx.coroutines instead of raw threads in new code.'
        value: 'java.util.Timer'
      - reason: 'android.util.Log is the project logger; System.out is dropped on device.'
        value: 'kotlin.io.println'
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'println is invisible on device; use android.util.Log.'
        value: 'kotlin.io.println'
      - reason: 'print is invisible on device; use android.util.Log.'
        value: 'kotlin.io.print'
      - reason: 'Locale-dependent; pass an explicit Locale (Turkish dotless-i).'
        value: 'java.lang.String.format(kotlin.String, kotlin.Array)'
