name: CI

# macOS runners are scarce, so a push only runs what it has to: docs-only
# changes skip CI, a newer push to the same branch cancels the older run,
# rustfmt fails fast on Linux before any other runner is taken, builds carry
# no debug info, Android builds one ABI, and the release
# build + bundle run only on demand (Actions → CI → Run workflow). Tags build
# and bundle in release.yml.

on:
  push:
    branches: [main]
    paths: &code
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!NOTICE'
      - '!packaging/homebrew/**'
      - '!.github/workflows/release.yml'
      # Markdown the tests read (highlighting samples)
      - 'crates/**/tests/**'
  pull_request:
    paths: *code
  workflow_dispatch:
    inputs:
      bundle:
        description: Also build and upload a signed Corvane.app
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # no debug info: less to compile, link and cache, and a failing test still
  # names its file and line
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: clippy · test (macOS)
    needs: fmt
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PR runs read main's cache but do not write their own; a red run
          # on main still saves what it compiled
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # grammars built from source (crates/corvane-grammars/build.rs); the
      # tree-sitter tests need all of them
      - uses: ./.github/actions/grammar-sources
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

      - name: build (release, precompiled Metal shaders)
        if: inputs.bundle
        run: cargo build --release --no-default-features -p corvane
      - name: code-signing certificate
        if: inputs.bundle
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: packaging/signing-cert.sh ci
      # Xcode 26's actool crashes on a macOS 15 host (its AssetCatalogAgent
      # links CoreMedia symbols only macOS 26 has), hence the macos-26 runner
      - name: bundle (Liquid Glass icon needs Xcode 26 actool)
        if: inputs.bundle
        run: |
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          packaging/bundle.sh release
          test -f target/bundle/Corvane.app/Contents/Resources/Assets.car
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' target/bundle/Corvane.app/Contents/Info.plist
          ditto -c -k --keepParent target/bundle/Corvane.app target/bundle/Corvane.app.zip
      - uses: actions/upload-artifact@v4
        if: inputs.bundle
        with:
          name: Corvane.app
          path: target/bundle/Corvane.app.zip

  linux:
    name: clippy · test (Linux)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # GPUI's X11 / Wayland backends; mold is the linker .cargo/config.toml
      # sets for x86_64 Linux
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev \
            gnome-keyring dbus-x11 zip unzip hunspell-en-us
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/grammar-sources
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # the keyring and notification tests talk to a session bus
      - name: test
        run: dbus-run-session -- cargo test --workspace
      # account tokens go through the secret service, never to disk in plain text
      - name: keyring round trip (gnome-keyring)
        run: dbus-run-session -- packaging/linux/keyring-test.sh
      # the .deb layout from a debug binary (release.yml packages the
      # release build); `cargo test` builds no binary for a crate without
      # integration tests
      - name: package smoke test (.deb)
        run: |
          cargo build -p corvane
          PACKAGE_BIN=target/debug/corvane packaging/linux/package.sh
          deb="$(ls target/linux/corvane_*_amd64.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/lib/corvane/corvane$|usr/lib/corvane/bin/corvane$|usr/bin/corvane -> |applications/com.wasimaster.corvane.desktop$'
          CORVANE_CLI_DRY_RUN=1 packaging/linux/corvane.sh open . | grep -q '^x-corvane://openLocalRepo/'


  # MSVC; GPUI's DirectX backend needs nothing installed. Git for Windows on
  # the runner checks text out with CRLF unless .gitattributes says otherwise
  # (it does).
  windows:
    name: clippy · test (Windows)
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/grammar-sources
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # the installer from a debug binary (release.yml packages the release
      # build), and the command line tool's batch file
      - name: package smoke test (installer)
        shell: pwsh
        run: |
          cargo build -p corvane
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          $env:PACKAGE_BIN = "target\debug\corvane.exe"
          packaging\windows\package.ps1
          if (-not (Get-ChildItem target\windows\Corvane-*-x86_64-setup.exe)) { throw "no installer" }
          $help = cmd /c packaging\windows\corvane.bat --help
          if (-not ($help -match "Corvane CLI usage")) { throw "the command line tool printed no usage" }

  # Both Android packages (foss and play) from one native library, on a
  # Linux runner: cargo-ndk cross-compiles, Gradle packages. One ABI is
  # enough to check a push (release.yml builds all four). The bundled git
  # (packaging/android/git) is cross-built once and cached.
  android:
    name: clippy · package (Android)
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.3.13750724
      ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: cache the bundled git
        uses: actions/cache@v4
        with:
          path: packaging/android/app/src/main/jniLibs
          key: android-git-${{ env.ABIS }}-${{ env.NDK_VERSION }}-${{ hashFiles('packaging/android/git/**') }}
      # rustc reports this lint for thread locals only on Android targets
      - name: clippy
        run: >
          cargo ndk -t arm64-v8a -P 26 clippy -p corvane --lib --
          -D warnings -A clippy::missing_const_for_thread_local
      - name: package (foss and play)
        run: packaging/android/build.sh debug
      # the bundle Google Play takes, with one grammar in the on-demand
      # module (release.yml builds them all)
      - name: bundle (play, with the grammar module)
        run: |
          UNITS=json packaging/android/grammars.sh
          cd packaging/android && ./gradlew --no-daemon :app:bundlePlayDebug
          unzip -l app/build/outputs/bundle/playDebug/app-play-debug.aab | grep -q 'grammars/lib/arm64-v8a/libcorvane_ts_index.so'
      - name: the play package asks for no all files access
        run: |
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"
          "$aapt" dump permissions packaging/android/app/build/outputs/apk/foss/debug/app-foss-debug.apk | grep -q MANAGE_EXTERNAL_STORAGE
          ! "$aapt" dump permissions packaging/android/app/build/outputs/apk/play/debug/app-play-debug.apk | grep -q MANAGE_EXTERNAL_STORAGE
      - uses: actions/upload-artifact@v4
        with:
          name: corvane-android-debug
          path: packaging/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
