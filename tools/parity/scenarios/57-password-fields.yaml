# Corvene's token and OAuth app steps of the sign-in dialog (GHD signs in to
# GitHub Enterprise in the browser only; deviations.md › GitHub Enterprise
# sign-in): the masked fields and their visibility toggles. An address with
# no OAuth app goes straight to the token, so nothing touches the network.
name: sign-in-token
description: Sign-in token and client secret fields (Corvene only)
setup: repo
steps:
  - ghd: {skip: true}
    corvene: {popup: sign-in-enterprise}
    wait: 700
  - ghd: {skip: true}
    corvene: {type: "https://ghe.example.com"}
  - ghd: {skip: true}
    corvene: {click: [802, 476]}
  - ghd: {skip: true}
    corvene: {type: ghp_parity}
  - snap: {name: token-masked, corvene_only: true}
  - ghd: {skip: true}
    corvene: {click: [847, 418]}
  - ghd: {skip: true}
    corvene: {hover: [683, 150]}
  - snap: {name: token-revealed, corvene_only: true}
  - ghd: {skip: true}
    corvene: {click: [670, 450]}
  - snap: {name: oauth-app, corvene_only: true}
  - ghd: {skip: true}
    corvene: {click: [683, 487]}
  - ghd: {skip: true}
    corvene: {type: parity-secret}
  - snap: {name: oauth-app-secret, corvene_only: true}
---
# Corvene on Android asks for an imported SSH key's passphrase
# (deviations.md › SSH key import); GHD's SSHKeyPassphrase prompt is a
# different dialog (ssh-agent, Remember passphrase).
name: ssh-key-passphrase
description: SSH key passphrase field (Corvene only)
setup: repo
steps:
  - ghd: {skip: true}
    corvene: {popup: ssh-key-passphrase}
    wait: 700
  - ghd: {skip: true}
    corvene: {type: parity-passphrase}
  - snap: {name: masked, corvene_only: true}
