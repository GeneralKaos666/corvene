name: history-coauthors
description: History rows and the selected commit's AvatarStack for two to six people, collapsed and spread on hover
setup: repo-coauthors
steps:
  - click: [187, 97]
    wait: 600
  - snap: open
  # the six-person row's stack: the "more" sliver gives way to all six
  - hover: [16, 183]
    wait: 600
  - snap: six-hovered
  - hover: [16, 233]
    wait: 600
  - snap: four-hovered
  # the selected commit's meta row
  - click: [124, 222]
    wait: 600
  - snap: four-selected
