# Corvene's Recent Activity (flag 1216-recent-activity, off in the GitHub
# Desktop preset the harness runs with). GHD has no reflog view, so the
# snaps are recorded, not compared (`corvene_only`; deviations.md ›
# History). The `repo-reflog` fixture's HEAD log has a rebase (one folded
# row), a branch deleted after use and three commits a hard reset left
# behind.
name: recent-activity
description: Repository › Recent Activity… list, an unreachable commit selected, the next row by keyboard (Corvene only)
setup: repo-reflog
corvene_flags: 1216-recent-activity=on
steps:
  - ghd: {skip: true}
    corvene: {action: "corvene::ShowRecentActivity"}
    wait: 1500
  - snap: {name: list, corvene_only: true, note: "GHD has no reflog view (deviations.md, 1216-recent-activity)"}
  # Commit: Draft C, which the reset left behind
  - ghd: {skip: true}
    corvene: {click: [68, 222]}
    wait: 800
  - snap: {name: unreachable-selected, corvene_only: true}
  - ghd: {skip: true}
    corvene: {key: down}
    wait: 800
  - snap: {name: next-row, corvene_only: true}
